name: Shutterdusk
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  ShutterduskDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Shutterdusk:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: ShutterduskDomain
        product: ShutterduskDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Shutterdusk
        INFOPLIST_KEY_CFBundleDisplayName: Shutterdusk
        INFOPLIST_KEY_NSCameraUsageDescription: Capture night test frames for AI long-exposure coaching
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import past night frames to compare exposure and noise
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free parameter Q&A while holding a tripod
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Dictate exposure settings (ISO, shutter, aperture, notes) into the coach
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  ShutterduskDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: ShutterduskDomain
        product: ShutterduskDomain
      - package: AppRuntimeCore
      - target: Shutterdusk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.shutterdusk.tests
schemes:
  Shutterdusk:
    build:
      targets:
        Shutterdusk: all
        ShutterduskDomainTests: [test]
    test:
      targets:
        - ShutterduskDomainTests
    run:
      config: Debug
