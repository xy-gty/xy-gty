name: Spinewell
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  SpinewellDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Spinewell:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: SpinewellDomain
        product: SpinewellDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Spinewell
        INFOPLIST_KEY_CFBundleDisplayName: Spinewell
        INFOPLIST_KEY_NSCameraUsageDescription: Capture cover, spine, or shelf-row photos to identify books on your personal shelf
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import library or bookshelf album stills to backfill your personal shelf
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free shelf location and TBR notes while holding books
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Speak shelf coach questions such as where a book is or mark reading progress
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  SpinewellDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - SpinewellUISmokeTests.swift
    dependencies:
      - package: SpinewellDomain
        product: SpinewellDomain
      - package: AppRuntimeCore
      - target: Spinewell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.spinewell.tests
  SpinewellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SpinewellUISmokeTests.swift
    dependencies:
      - target: Spinewell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.spinewell.uitests
        TEST_TARGET_NAME: Spinewell
schemes:
  Spinewell:
    build:
      targets:
        Spinewell: all
        SpinewellDomainTests: [test]
        SpinewellUITests: [test]
    test:
      targets:
        - SpinewellDomainTests
        - SpinewellUITests
    run:
      config: Debug
