name: Bightstep
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  BightstepDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Bightstep:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
    dependencies:
      - package: AppRuntimeCore
      - package: BightstepDomain
        product: BightstepDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Bightstep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Bightstep
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Bightstep imports practice reference photos to diagnose which rope-knot step drifted.
        INFOPLIST_KEY_NSCameraUsageDescription: Bightstep photographs in-progress rope knots to recognize stage and wrong hauls.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Bightstep uses the microphone so you can ask hands-free coach questions while both hands hold the rope.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Bightstep uses on-device speech recognition to turn spoken commands into editable coach chat text you review before sending.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  BightstepDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: BightstepDomain
        product: BightstepDomain
      - package: AppRuntimeCore
      - target: Bightstep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.bightstep.tests
schemes:
  Bightstep:
    build:
      targets:
        Bightstep: all
        BightstepDomainTests: [test]
    test:
      targets:
        - BightstepDomainTests
    run:
      config: Debug
