name: Sunbrief
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  SunbriefDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Sunbrief:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: SunbriefDomain
        product: SunbriefDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Sunbrief
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Sunbrief
        INFOPLIST_KEY_NSCameraUsageDescription: On-site composition capture + scene recognition for scouting
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import prior scouting shots; recompute best shoot windows
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate shoot notes and intent into the scout plan
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken intent such as golden-hour ridge timing into a timed plan and coach chat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  SunbriefDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: SunbriefDomain
        product: SunbriefDomain
      - package: AppRuntimeCore
      - target: Sunbrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.sunbrief.tests
schemes:
  Sunbrief:
    build:
      targets:
        Sunbrief: all
        SunbriefDomainTests: [test]
    test:
      targets:
        - SunbriefDomainTests
    run:
      config: Debug
