name: RuleCueAcceptUI
options:
  bundleIdPrefix: xycoins.2027.test
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
targets:
  HostStub:
    type: application
    platform: iOS
    sources: [HostStub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test.rulecue.accept.host
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  RuleCueAcceptUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RuleCueAcceptUITests]
    dependencies:
      - target: HostStub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test.rulecue.accept.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        TEST_TARGET_NAME: HostStub

schemes:
  RuleCueAcceptUI:
    build:
      targets:
        HostStub: all
        RuleCueAcceptUITests: [test]
    test:
      targets:
        - RuleCueAcceptUITests
