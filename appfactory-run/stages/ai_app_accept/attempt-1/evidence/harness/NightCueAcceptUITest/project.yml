name: NightCueAcceptUITest
options:
  bundleIdPrefix: com.appfactory.accept
  deploymentTarget:
    iOS: "17.0"
settings:
  BASE:
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.appfactory.accept.host
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_NAME: Host
  NightCueAcceptUITestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NightCueAcceptUITestUITests]
    dependencies:
      - target: Host
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.appfactory.accept.NightCueAcceptUITests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: ""
      BUNDLE_LOADER: ""

schemes:
  NightCueAcceptUITest:
    build:
      targets:
        Host: all
        NightCueAcceptUITestUITests: [test]
    test:
      targets:
        - NightCueAcceptUITestUITests
