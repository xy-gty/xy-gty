name: CellarCueAcceptHarness
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
projectReferences:
  CellarCueProduct:
    path: ../../../../product/CellarCue.xcodeproj
targets:
  CellarCueAcceptUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    dependencies:
      - target: CellarCueProduct/CellarCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.cellarcue.acceptuitests
        TEST_TARGET_NAME: CellarCue
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AcceptHarness:
    build:
      targets:
        CellarCueAcceptUITests: [test]
    test:
      targets:
        - CellarCueAcceptUITests
