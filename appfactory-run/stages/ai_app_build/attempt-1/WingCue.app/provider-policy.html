<h1>DeepSeek provider policy (local)</h1>
<p>When configured, WingCue may send bird still descriptors, questions, confirmed marks, lookalike pair ids, and optional voice transcripts to <span class="accent">DeepSeek</span> after in-app consent (disclosure <code>wingcue.consent.v1</code>).</p>
<p>Revoke consent in Settings to stop outbound AI immediately.</p>
