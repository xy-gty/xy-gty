name: FrameCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  FrameCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FrameCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: FrameCueDomain
        product: FrameCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.framecue
        PRODUCT_NAME: FrameCue
        INFOPLIST_KEY_CFBundleDisplayName: FrameCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture on-set framing trial shots for composition coaching
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import scout or reference stills for aspect and framing analysis
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free on-set director cues while both hands hold the camera
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Spoken shot-size instructions written into coach chat and refresh overlays
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  FrameCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: FrameCueDomain
        product: FrameCueDomain
      - package: AppRuntimeCore
      - target: FrameCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.framecue.tests
schemes:
  FrameCue:
    build:
      targets:
        FrameCue: all
        FrameCueDomainTests: [test]
    test:
      targets:
        - FrameCueDomainTests
    run:
      config: Debug
