name: WingCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  WingCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  WingCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: WingCueDomain
        product: WingCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.wingcue
        PRODUCT_NAME: WingCue
        INFOPLIST_KEY_CFBundleDisplayName: WingCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture bird plumage close-ups for species identification
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import trip album stills for species ID sessions
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record hands-free field voice notes while holding binoculars
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Speak lookalike coach questions without typing
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  WingCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: WingCueDomain
        product: WingCueDomain
      - package: AppRuntimeCore
      - target: WingCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.wingcue.tests
schemes:
  WingCue:
    build:
      targets:
        WingCue: all
        WingCueDomainTests: [test]
    test:
      targets:
        - WingCueDomainTests
    run:
      config: Debug
