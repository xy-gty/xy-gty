name: HiveCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  HiveCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  HiveCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: HiveCueDomain
        product: HiveCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.hivecue
        PRODUCT_NAME: HiveCue
        INFOPLIST_KEY_CFBundleDisplayName: HiveCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture brood-frame photos for AI hive inspection
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import past frame photos to compare brood / stores / pests
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free inspection notes while suited and gloved
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Dictate inspection fields (queen seen, temperament, notes) into the log
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  HiveCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: HiveCueDomain
        product: HiveCueDomain
      - package: AppRuntimeCore
      - target: HiveCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.hivecue.tests
schemes:
  HiveCue:
    build:
      targets:
        HiveCue: all
        HiveCueDomainTests: [test]
    test:
      targets:
        - HiveCueDomainTests
    run:
      config: Debug
