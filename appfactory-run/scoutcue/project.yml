name: ScoutCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  ScoutCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ScoutCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: ScoutCueDomain
        product: ScoutCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.scoutcue
        PRODUCT_NAME: ScoutCue
        INFOPLIST_KEY_CFBundleDisplayName: ScoutCue
        INFOPLIST_KEY_NSCameraUsageDescription: On-site composition capture + scene recognition for scouting
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import prior scouting shots; recompute best shoot windows
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate shoot notes and intent into the scout plan
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken intent such as golden-hour ridge timing into a timed plan and coach chat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  ScoutCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: ScoutCueDomain
        product: ScoutCueDomain
      - package: AppRuntimeCore
      - target: ScoutCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.scoutcue.tests
schemes:
  ScoutCue:
    build:
      targets:
        ScoutCue: all
        ScoutCueDomainTests: [test]
    test:
      targets:
        - ScoutCueDomainTests
    run:
      config: Debug
