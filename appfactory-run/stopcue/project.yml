name: StopCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  StopCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  StopCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: StopCueDomain
        product: StopCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.stopcue
        PRODUCT_NAME: StopCue
        INFOPLIST_KEY_CFBundleDisplayName: StopCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture frame-by-frame stop-motion sequences for AI coaching
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import frame sequences into the StopCue coach timeline
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free interval and cue edits while shooting
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Dictate interval or cue edits (e.g. next frame a bit closer) into the storyboard coach
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  StopCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: StopCueDomain
        product: StopCueDomain
      - package: AppRuntimeCore
      - target: StopCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.stopcue.tests
schemes:
  StopCue:
    build:
      targets:
        StopCue: all
        StopCueDomainTests: [test]
    test:
      targets:
        - StopCueDomainTests
    run:
      config: Debug
