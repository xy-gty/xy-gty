name: Countroom
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  CountroomDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Countroom:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: CountroomDomain
        product: CountroomDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Countroom
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Countroom
        INFOPLIST_KEY_NSCameraUsageDescription: Capture sheet music or fingering photos so Countroom can coach your practice
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import existing exercise or sheet photos for practice coaching
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Listen for pitch and rhythm feedback from your instrument mic
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken practice goals into text for the AI practice coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  CountroomDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: CountroomDomain
        product: CountroomDomain
      - package: AppRuntimeCore
      - target: Countroom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.countroom.tests
schemes:
  Countroom:
    build:
      targets:
        Countroom: all
        CountroomDomainTests: [test]
    test:
      targets:
        - CountroomDomainTests
    run:
      config: Debug
