name: PitchCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  PitchCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  PitchCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: PitchCueDomain
        product: PitchCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.pitchcue
        PRODUCT_NAME: PitchCue
        INFOPLIST_KEY_CFBundleDisplayName: PitchCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture sheet music or fingering photos so PitchCue can coach your practice
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import existing exercise or sheet photos for practice coaching
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Listen for pitch and rhythm feedback from your instrument mic
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken practice goals into text for the AI practice coach
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  PitchCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: PitchCueDomain
        product: PitchCueDomain
      - package: AppRuntimeCore
      - target: PitchCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.pitchcue.tests
schemes:
  PitchCue:
    build:
      targets:
        PitchCue: all
        PitchCueDomainTests: [test]
    test:
      targets:
        - PitchCueDomainTests
    run:
      config: Debug
