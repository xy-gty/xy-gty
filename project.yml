name: Gillnote
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  GillnoteDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Gillnote:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: GillnoteDomain
        product: GillnoteDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Gillnote
        INFOPLIST_KEY_CFBundleDisplayName: Gillnote
        INFOPLIST_KEY_NSCameraUsageDescription: Capture cap, gill, and pore close-ups so Gillnote can help identify field finds
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import hike album stills to complete species identification in Gillnote
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record hands-free field notes while holding a knife or basket
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken lookalike and habitat questions into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  GillnoteDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: GillnoteDomain
        product: GillnoteDomain
      - package: AppRuntimeCore
      - target: Gillnote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.gillnote.tests

  GillnoteUISmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Gillnote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.gillnote.uitests
        TEST_TARGET_NAME: Gillnote
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gillnote:
    build:
      targets:
        Gillnote: all
        GillnoteDomainTests: [test]
        GillnoteUISmokeTests: [test]
    test:
      targets:
        - GillnoteDomainTests
        - GillnoteUISmokeTests
    run:
      config: Debug
