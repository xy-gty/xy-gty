name: KnotCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  KnotCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  KnotCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
    dependencies:
      - package: AppRuntimeCore
      - package: KnotCueDomain
        product: KnotCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.knotcue
        PRODUCT_NAME: KnotCue
        INFOPLIST_KEY_CFBundleDisplayName: KnotCue
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: KnotCue imports practice reference photos to diagnose which rope-knot step drifted.
        INFOPLIST_KEY_NSCameraUsageDescription: KnotCue photographs in-progress rope knots to recognize stage and wrong hauls.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: KnotCue uses the microphone so you can ask hands-free coach questions while both hands hold the rope.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: KnotCue uses on-device speech recognition to turn spoken commands into editable coach chat text you review before sending.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  KnotCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: KnotCueDomain
        product: KnotCueDomain
      - package: AppRuntimeCore
      - target: KnotCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.knotcue.tests
schemes:
  KnotCue:
    build:
      targets:
        KnotCue: all
        KnotCueDomainTests: [test]
    test:
      targets:
        - KnotCueDomainTests
    run:
      config: Debug
