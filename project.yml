name: BendCoach
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  BendCoachDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  BendCoach:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
    dependencies:
      - package: AppRuntimeCore
      - package: BendCoachDomain
        product: BendCoachDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.bendcoach
        PRODUCT_NAME: BendCoach
        INFOPLIST_KEY_CFBundleDisplayName: BendCoach AI
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: BendCoach AI imports job-site conduit bend and markup photos you choose so you can review bend-type suggestions before saving marks to a job.
        INFOPLIST_KEY_NSCameraUsageDescription: BendCoach AI can capture a job-site bend or markup photo for optional recognition review.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: BendCoach AI uses the microphone so you can speak bend-math questions that fill the coach chat before you send.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: BendCoach AI uses on-device speech recognition to turn spoken bend-math questions into editable chat text that you review before sending.
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  BendCoachDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: BendCoachDomain
        product: BendCoachDomain
      - package: AppRuntimeCore
      - target: BendCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.bendcoach.tests
schemes:
  BendCoach:
    build:
      targets:
        BendCoach: all
        BendCoachDomainTests: [test]
    test:
      targets:
        - BendCoachDomainTests
    run:
      config: Debug
