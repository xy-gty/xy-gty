name: FinishCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  FinishCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FinishCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: FinishCueDomain
        product: FinishCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.finishcue
        PRODUCT_NAME: FinishCue
        INFOPLIST_KEY_CFBundleDisplayName: FinishCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture finish-line slit or video so FinishCue can read lanes and times
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import training or amateur-meet finish strips for review and coaching
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free start and lap calls while the phone is racked at the finish
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken cues like start heat or mark lane into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  FinishCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - FinishCueUISmokeTests.swift
    dependencies:
      - package: FinishCueDomain
        product: FinishCueDomain
      - package: AppRuntimeCore
      - target: FinishCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.finishcue.tests
  FinishCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FinishCueUISmokeTests.swift
    dependencies:
      - target: FinishCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.finishcue.uitests
        TEST_TARGET_NAME: FinishCue
schemes:
  FinishCue:
    build:
      targets:
        FinishCue: all
        FinishCueDomainTests: [test]
        FinishCueUITests: [test]
    test:
      targets:
        - FinishCueDomainTests
        - FinishCueUITests
    run:
      config: Debug
