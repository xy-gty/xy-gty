name: Fieldmark
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  FieldmarkDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Fieldmark:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: FieldmarkDomain
        product: FieldmarkDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Fieldmark
        INFOPLIST_KEY_CFBundleDisplayName: Fieldmark
        INFOPLIST_KEY_NSCameraUsageDescription: Capture bird plumage close-ups for species identification
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import trip album stills for species ID sessions
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record hands-free field voice notes while holding binoculars
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Speak lookalike coach questions without typing
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  FieldmarkDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: FieldmarkDomain
        product: FieldmarkDomain
      - package: AppRuntimeCore
      - target: Fieldmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.fieldmark.tests
schemes:
  Fieldmark:
    build:
      targets:
        Fieldmark: all
        FieldmarkDomainTests: [test]
    test:
      targets:
        - FieldmarkDomainTests
    run:
      config: Debug
