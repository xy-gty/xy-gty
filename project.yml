name: BrewCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  BrewCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  BrewCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: BrewCueDomain
        product: BrewCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.brewcue
        PRODUCT_NAME: BrewCue
        INFOPLIST_KEY_CFBundleDisplayName: BrewCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture beans, grounds, bloom, pour, or crema so BrewCue can coach your pour-over
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import post-brew shots for diagnosis and pour-over coaching
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free pour cues while both hands hold the kettle
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken cues like 1:16 V60 or next pour into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  BrewCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - BrewCueUISmokeTests.swift
    dependencies:
      - package: BrewCueDomain
        product: BrewCueDomain
      - package: AppRuntimeCore
      - target: BrewCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.brewcue.tests
  BrewCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BrewCueUISmokeTests.swift
    dependencies:
      - target: BrewCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.brewcue.uitests
        TEST_TARGET_NAME: BrewCue
schemes:
  BrewCue:
    build:
      targets:
        BrewCue: all
        BrewCueDomainTests: [test]
        BrewCueUITests: [test]
    test:
      targets:
        - BrewCueDomainTests
        - BrewCueUITests
