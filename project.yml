name: MixCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  MixCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  MixCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: MixCueDomain
        product: MixCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.mixcue
        PRODUCT_NAME: MixCue
        INFOPLIST_KEY_CFBundleDisplayName: MixCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture bottle faces, labels, and garnish stills so MixCue can identify base spirits for your mix session
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import bar-shelf album stills to complete spirit identification in MixCue
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record hands-free voice notes while both hands shake or stir
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken substitute and recipe questions into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  MixCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: MixCueDomain
        product: MixCueDomain
      - package: AppRuntimeCore
      - target: MixCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.mixcue.tests
schemes:
  MixCue:
    build:
      targets:
        MixCue: all
        MixCueDomainTests: [test]
    test:
      targets:
        - MixCueDomainTests
    run:
      config: Debug
