name: RuleCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  RuleCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  RuleCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: RuleCueDomain
        product: RuleCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.rulecue
        PRODUCT_NAME: RuleCue
        INFOPLIST_KEY_CFBundleDisplayName: RuleCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture rulebook pages, component close-ups, and current table layout for AI setup coaching
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import rulebook page images or past table photos to compare setups
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free rules questions while setting up the table
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Write spoken rules questions into the coach chat and trigger the next tip
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  RuleCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: RuleCueDomain
        product: RuleCueDomain
      - package: AppRuntimeCore
      - target: RuleCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.rulecue.tests
schemes:
  RuleCue:
    build:
      targets:
        RuleCue: all
        RuleCueDomainTests: [test]
    test:
      targets:
        - RuleCueDomainTests
    run:
      config: Debug
