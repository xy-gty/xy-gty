name: SnagCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  SnagCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  SnagCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    dependencies:
      - package: AppRuntimeCore
      - package: SnagCueDomain
        product: SnagCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.snagcue
        PRODUCT_NAME: SnagCue
        INFOPLIST_KEY_CFBundleDisplayName: SnagCue AI
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: SnagCue AI imports walkthrough photos you choose so you can review snag suggestions before saving punch-list items.
        INFOPLIST_KEY_NSCameraUsageDescription: SnagCue AI can capture a walkthrough photo for optional snag recognition review.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  SnagCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: SnagCueDomain
        product: SnagCueDomain
      - package: AppRuntimeCore
      - target: SnagCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.snagcue.tests
schemes:
  SnagCue:
    build:
      targets:
        SnagCue: all
        SnagCueDomainTests: [test]
    test:
      targets:
        - SnagCueDomainTests
    run:
      config: Debug
