name: FolioCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  FolioCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FolioCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: FolioCueDomain
        product: FolioCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.foliocue
        PRODUCT_NAME: FolioCue
        INFOPLIST_KEY_CFBundleDisplayName: FolioCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture cover, spine, or shelf-row photos to identify books on your personal shelf
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import library or bookshelf album stills to backfill your personal shelf
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free shelf location and TBR notes while holding books
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Speak shelf coach questions such as where a book is or mark reading progress
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  FolioCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - FolioCueUISmokeTests.swift
    dependencies:
      - package: FolioCueDomain
        product: FolioCueDomain
      - package: AppRuntimeCore
      - target: FolioCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.foliocue.tests
  FolioCueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FolioCueUISmokeTests.swift
    dependencies:
      - target: FolioCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.foliocue.uitests
        TEST_TARGET_NAME: FolioCue
schemes:
  FolioCue:
    build:
      targets:
        FolioCue: all
        FolioCueDomainTests: [test]
        FolioCueUITests: [test]
    test:
      targets:
        - FolioCueDomainTests
        - FolioCueUITests
    run:
      config: Debug
