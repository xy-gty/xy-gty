name: Racknote
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  RacknoteDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Racknote:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: RacknoteDomain
        product: RacknoteDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Racknote
        INFOPLIST_KEY_CFBundleDisplayName: Racknote
        INFOPLIST_KEY_NSCameraUsageDescription: Capture wine label, cork, and bin-tag stills so Racknote can place bottles in your cellar grid
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import cellar photos to complete label OCR and bin placement in Racknote
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record hands-free bin notes while carrying bottles
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken drinking-window and pairing questions into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  RacknoteDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: RacknoteDomain
        product: RacknoteDomain
      - package: AppRuntimeCore
      - target: Racknote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.racknote.tests

  RacknoteUISmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Racknote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.racknote.uitests
        TEST_TARGET_NAME: Racknote
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Racknote:
    build:
      targets:
        Racknote: all
        RacknoteDomainTests: [test]
        RacknoteUISmokeTests: [test]
    test:
      targets:
        - RacknoteDomainTests
        - RacknoteUISmokeTests
    run:
      config: Debug
