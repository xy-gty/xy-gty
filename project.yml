name: Airspan
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  AirspanDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Airspan:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
    dependencies:
      - package: AppRuntimeCore
      - package: AirspanDomain
        product: AirspanDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Airspan
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Airspan
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Airspan imports as-built drawings and job photos so you can read duct dimensions and review runs before saving.
        INFOPLIST_KEY_NSCameraUsageDescription: Airspan photographs ducts and registers on site for run recognition you review before saving.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Airspan uses the microphone so you can ask airflow questions hands-free that fill coach chat before you send.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Airspan uses on-device speech recognition to turn spoken airflow numbers into editable coach chat text you review before sending.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  AirspanDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: AirspanDomain
        product: AirspanDomain
      - package: AppRuntimeCore
      - target: Airspan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.airspan.tests
schemes:
  Airspan:
    build:
      targets:
        Airspan: all
        AirspanDomainTests: [test]
    test:
      targets:
        - AirspanDomainTests
    run:
      config: Debug
