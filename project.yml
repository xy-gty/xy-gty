name: FormCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  FormCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FormCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: FormCueDomain
        product: FormCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.formcue
        PRODUCT_NAME: FormCue
        INFOPLIST_KEY_CFBundleDisplayName: FormCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture mid-set form / posture for AI correction
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import demo / reference poses into the coach flow
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free coach dictate while both hands train
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "e.g. skip rest / spoken interval intent → coach + TTS"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  FormCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: FormCueDomain
        product: FormCueDomain
      - package: AppRuntimeCore
      - target: FormCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.formcue.tests
schemes:
  FormCue:
    build:
      targets:
        FormCue: all
        FormCueDomainTests: [test]
    test:
      targets:
        - FormCueDomainTests
    run:
      config: Debug
