name: Broodcheck
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  BroodcheckDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Broodcheck:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: BroodcheckDomain
        product: BroodcheckDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Broodcheck
        INFOPLIST_KEY_CFBundleDisplayName: Broodcheck
        INFOPLIST_KEY_NSCameraUsageDescription: Capture brood-frame photos for AI hive inspection
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import past frame photos to compare brood / stores / pests
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free inspection notes while suited and gloved
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Dictate inspection fields (queen seen, temperament, notes) into the log
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  BroodcheckDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: BroodcheckDomain
        product: BroodcheckDomain
      - package: AppRuntimeCore
      - target: Broodcheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.broodcheck.tests
schemes:
  Broodcheck:
    build:
      targets:
        Broodcheck: all
        BroodcheckDomainTests: [test]
    test:
      targets:
        - BroodcheckDomainTests
    run:
      config: Debug
