name: DocBrief
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  DocBriefDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  DocBrief:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    dependencies:
      - package: AppRuntimeCore
      - package: DocBriefDomain
        product: DocBriefDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.docbrief
        PRODUCT_NAME: DocBrief
        INFOPLIST_KEY_CFBundleDisplayName: DocBrief AI
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: DocBrief AI imports document, whiteboard, or receipt photos you choose so you can review type and field suggestions before saving a brief.
        INFOPLIST_KEY_NSCameraUsageDescription: DocBrief AI can capture a document, whiteboard, or receipt photo for optional recognition review.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: DocBrief AI uses the microphone so you can dictate a voice supplement for action titles, due dates, or spoken briefing questions before you Save or discard.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: DocBrief AI uses on-device speech recognition to turn your voice supplement into editable action or briefing text that you review with Save or Not this.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  DocBriefDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: DocBriefDomain
        product: DocBriefDomain
      - package: AppRuntimeCore
      - target: DocBrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.docbrief.tests
schemes:
  DocBrief:
    build:
      targets:
        DocBrief: all
        DocBriefDomainTests: [test]
    test:
      targets:
        - DocBriefDomainTests
    run:
      config: Debug
