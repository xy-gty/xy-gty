name: ClosetCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  ClosetCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ClosetCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
    dependencies:
      - package: AppRuntimeCore
      - package: ClosetCueDomain
        product: ClosetCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.closetcue
        PRODUCT_NAME: ClosetCue
        INFOPLIST_KEY_CFBundleDisplayName: ClosetCue
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: ClosetCue imports garment photos you choose so you can review tags before saving pieces to your closet catalog.
        INFOPLIST_KEY_NSCameraUsageDescription: ClosetCue can snap garment photos into your closet catalog for optional recognition review.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: ClosetCue uses the microphone so you can speak outfit questions that fill stylist chat before you send.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: ClosetCue uses on-device speech recognition to turn spoken outfit questions into editable stylist chat text you review before sending.
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  ClosetCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: ClosetCueDomain
        product: ClosetCueDomain
      - package: AppRuntimeCore
      - target: ClosetCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.closetcue.tests
schemes:
  ClosetCue:
    build:
      targets:
        ClosetCue: all
        ClosetCueDomainTests: [test]
    test:
      targets:
        - ClosetCueDomainTests
    run:
      config: Debug
