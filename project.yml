name: CuePartner
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  CuePartnerDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  CuePartner:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
    dependencies:
      - package: AppRuntimeCore
      - package: CuePartnerDomain
        product: CuePartnerDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.cuepartner
        PRODUCT_NAME: CuePartner
        INFOPLIST_KEY_CFBundleDisplayName: CuePartner AI
        INFOPLIST_KEY_NSCameraUsageDescription: Capture handwritten or printed script draft pages for OCR
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import script photos so CuePartner can OCR your own pages
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record rehearsal or line voice notes for practice
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken lines into text for the AI scene partner
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  CuePartnerDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: CuePartnerDomain
        product: CuePartnerDomain
      - package: AppRuntimeCore
      - target: CuePartner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.cuepartner.tests
schemes:
  CuePartner:
    build:
      targets:
        CuePartner: all
        CuePartnerDomainTests: [test]
    test:
      targets:
        - CuePartnerDomainTests
    run:
      config: Debug
