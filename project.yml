name: Bloomkettle
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  BloomkettleDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Bloomkettle:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: BloomkettleDomain
        product: BloomkettleDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Bloomkettle
        INFOPLIST_KEY_CFBundleDisplayName: Bloomkettle
        INFOPLIST_KEY_NSCameraUsageDescription: Capture beans, grounds, bloom, pour, or crema so Bloomkettle can coach your pour-over
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import post-brew shots for diagnosis and pour-over coaching
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free pour cues while both hands hold the kettle
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken cues like 1:16 V60 or next pour into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  BloomkettleDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - BloomkettleUISmokeTests.swift
    dependencies:
      - package: BloomkettleDomain
        product: BloomkettleDomain
      - package: AppRuntimeCore
      - target: Bloomkettle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.bloomkettle.tests
  BloomkettleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/BloomkettleUISmokeTests.swift
    dependencies:
      - target: Bloomkettle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.bloomkettle.uitests
        TEST_TARGET_NAME: Bloomkettle
schemes:
  Bloomkettle:
    build:
      targets:
        Bloomkettle: all
        BloomkettleDomainTests: [test]
        BloomkettleUITests: [test]
    test:
      targets:
        - BloomkettleDomainTests
        - BloomkettleUITests
