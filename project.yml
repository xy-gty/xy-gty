name: SporeCue
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  SporeCueDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  SporeCue:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: SporeCueDomain
        product: SporeCueDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.sporecue
        PRODUCT_NAME: SporeCue
        INFOPLIST_KEY_CFBundleDisplayName: SporeCue
        INFOPLIST_KEY_NSCameraUsageDescription: Capture cap, gill, and pore close-ups so SporeCue can help identify field finds
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import hike album stills to complete species identification in SporeCue
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record hands-free field notes while holding a knife or basket
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken lookalike and habitat questions into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  SporeCueDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: SporeCueDomain
        product: SporeCueDomain
      - package: AppRuntimeCore
      - target: SporeCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.sporecue.tests

  SporeCueUISmokeTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SporeCue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.sporecue.uitests
        TEST_TARGET_NAME: SporeCue
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SporeCue:
    build:
      targets:
        SporeCue: all
        SporeCueDomainTests: [test]
        SporeCueUISmokeTests: [test]
    test:
      targets:
        - SporeCueDomainTests
        - SporeCueUISmokeTests
    run:
      config: Debug
