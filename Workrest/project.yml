name: Workrest
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  WorkrestDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Workrest:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: WorkrestDomain
        product: WorkrestDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Workrest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Workrest
        INFOPLIST_KEY_NSCameraUsageDescription: Capture mid-set form / posture for AI correction
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import demo / reference poses into the coach flow
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free coach dictate while both hands train
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "e.g. skip rest / spoken interval intent → coach + TTS"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
  WorkrestDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: WorkrestDomain
        product: WorkrestDomain
      - package: AppRuntimeCore
      - target: Workrest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.workrest.tests
schemes:
  Workrest:
    build:
      targets:
        Workrest: all
        WorkrestDomainTests: [test]
    test:
      targets:
        - WorkrestDomainTests
    run:
      config: Debug
