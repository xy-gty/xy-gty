name: Heatbar
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  HeatbarDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Heatbar:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: HeatbarDomain
        product: HeatbarDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Heatbar
        INFOPLIST_KEY_CFBundleDisplayName: Heatbar
        INFOPLIST_KEY_NSCameraUsageDescription: Capture finish-line slit or video so Heatbar can read lanes and times
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import training or amateur-meet finish strips for review and coaching
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free start and lap calls while the phone is racked at the finish
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Turn spoken cues like start heat or mark lane into coach chat text
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  HeatbarDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - HeatbarUISmokeTests.swift
    dependencies:
      - package: HeatbarDomain
        product: HeatbarDomain
      - package: AppRuntimeCore
      - target: Heatbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.heatbar.tests
  HeatbarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HeatbarUISmokeTests.swift
    dependencies:
      - target: Heatbar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.heatbar.uitests
        TEST_TARGET_NAME: Heatbar
schemes:
  Heatbar:
    build:
      targets:
        Heatbar: all
        HeatbarDomainTests: [test]
        HeatbarUITests: [test]
    test:
      targets:
        - HeatbarDomainTests
        - HeatbarUITests
    run:
      config: Debug
