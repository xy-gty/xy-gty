name: Tablehost
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AppRuntimeCore:
    path: Vendor/AppRuntimeCore
  TablehostDomain:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Tablehost:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: App/Resources
      - path: App/Assets.xcassets
      - path: App/Info.plist
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: AppRuntimeCore
      - package: TablehostDomain
        product: TablehostDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xycoins.2027.test
        PRODUCT_NAME: Tablehost
        INFOPLIST_KEY_CFBundleDisplayName: Tablehost
        INFOPLIST_KEY_NSCameraUsageDescription: Capture rulebook pages, component close-ups, and current table layout for AI setup coaching
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Import rulebook page images or past table photos to compare setups
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Hands-free rules questions while setting up the table
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Write spoken rules questions into the coach chat and trigger the next tip
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
  TablehostDomainTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - package: TablehostDomain
        product: TablehostDomain
      - package: AppRuntimeCore
      - target: Tablehost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingguang.tablehost.tests
schemes:
  Tablehost:
    build:
      targets:
        Tablehost: all
        TablehostDomainTests: [test]
    test:
      targets:
        - TablehostDomainTests
    run:
      config: Debug
